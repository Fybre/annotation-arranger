[project]
name = "annotation-arranger"
version = "0.1.3"
description = "Synchronous Therefore PDF stamp arrangement service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pypdf==6.21.4",
  "pikepdf==10.17.0",
  "python-dotenv==1.2.4",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["arranger*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

